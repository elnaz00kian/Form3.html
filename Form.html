<!DOCTYPE html>
<html>

<head>
    <title>Student Information</title>

    <style>
        body {
            background: #f5f0e8;
            text-align: center;
        }

        form {
            background: #c95f09;
            color: white;
            width: 320px;
            margin: 40px auto;
            padding: 20px;
            border-radius: 8px;
        }

        input {
            margin: 10px;
            padding: 8px;
            border: none;
            border-radius: 4px;
        }

        .reset {
            background: #d9a441;
            color: white;
            cursor: pointer;
        }
    </style>
</head>

<body>

    <h2>Student Information Form</h2>

    <form>
        First Name <input type="text" name="fname"><br>
        Last Name <input type="text" name="lname"><br>
        Phone <input type="text" name="phone"><br>
        Address <input type="text" name="address"><br>

        <input type="reset" class="reset" value="Clear">
    </form>

</body>

</html>

<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Student Table</title>

    <style>
        body {
            background-color: #f0f4f8;
            text-align: center;
        }

        h2 {
            color: #34495e;
            margin-top: 30px;
        }

        table {
            border-collapse: collapse;
            width: 65%;
            margin: 25px auto;
            background-color: white;
        }

        th {
            background-color: #4682b4;
            color: white;
            padding: 12px;
        }

        td {
            border: 1px solid #cccccc;
            padding: 10px;
            color: #444444;
        }

        tr:nth-child(even) {
            background-color: #eaf2f8;
        }

        tr:hover {
            background-color: #d6eaf8;
        }
    </style>
</head>

<body>

    <table>
        <tr>
            <th>Number</th>
            <th>First Name</th>
            <th>Last Name</th>
            <th>Age</th>
        </tr>

        <tr>
            <td>1</td>
            <td>elnaz</td>
            <td>Kiani</td>
            <td>23</td>
        </tr>

        <tr>
            <td>2</td>
            <td>Armin</td>
            <td>Ahmadi</td>
            <td>20</td>
        </tr>

        <tr>
            <td>3</td>
            <td>Nazanin</td>
            <td>Karimi</td>
            <td>21</td>
        </tr>

    </table>

</body>

</html>
